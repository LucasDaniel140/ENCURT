<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ENCURT - Encurtador de links</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0f172a;color:#e2e8f0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:16px}
  .card{width:100%;max-width:480px;background:#1e293b;border-radius:16px;padding:32px}
  h1{margin:0 0 4px;font-size:28px}
  .sub{margin:0 0 24px;color:#94a3b8;font-size:15px}
  label.field{display:block;font-size:14px;color:#cbd5e1;margin-bottom:6px}
  input[type=text]{width:100%;padding:14px;border-radius:10px;border:1px solid #334155;background:#0f172a;color:#e2e8f0;font-size:16px}
  input[type=text]:focus{outline:2px solid #38bdf8;border-color:transparent}
  .check{display:flex;align-items:center;gap:10px;margin:16px 0 20px;font-size:15px;cursor:pointer}
  .check input{width:18px;height:18px;accent-color:#38bdf8}
  button{width:100%;padding:14px;border:0;border-radius:10px;background:#38bdf8;color:#0f172a;font-size:16px;font-weight:700;cursor:pointer}
  button:hover{background:#7dd3fc}
  button:disabled{opacity:.6;cursor:default}
  .error{color:#fca5a5;font-size:14px;margin:12px 0 0;min-height:1em}
  .result{margin-top:20px;padding:16px;border-radius:10px;background:#0f172a;border:1px solid #334155}
  .result p{margin:0 0 10px;font-size:13px;color:#94a3b8}
  .row{display:flex;gap:8px}
  .row input{flex:1;min-width:0}
  .row button{width:auto;padding:0 18px;white-space:nowrap}
  [hidden]{display:none}
</style>
</head>
<body>
<main class="card">
  <h1>ENCURT</h1>
  <p class="sub">Cole o link e gere uma versão curta.</p>

  <form id="form">
    <label class="field" for="url">Link original</label>
    <input type="text" id="url" placeholder="https://exemplo.com/pagina" autocomplete="off" inputmode="url" required>

    <label class="check">
      <input type="checkbox" id="timer">
      Mostrar timer de 5 segundos antes de redirecionar
    </label>

    <button type="submit" id="submit">Encurtar link</button>
    <p class="error" id="error" role="alert"></p>
  </form>

  <div class="result" id="result" hidden>
    <p id="resultInfo"></p>
    <div class="row">
      <input type="text" id="short" readonly>
      <button type="button" id="copy">Copiar</button>
    </div>
  </div>
</main>

<script>
  const form = document.getElementById('form');
  const urlInput = document.getElementById('url');
  const timerInput = document.getElementById('timer');
  const submit = document.getElementById('submit');
  const error = document.getElementById('error');
  const result = document.getElementById('result');
  const resultInfo = document.getElementById('resultInfo');
  const short = document.getElementById('short');
  const copy = document.getElementById('copy');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    error.textContent = '';
    submit.disabled = true;
    try {
      const res = await fetch('/api/shorten', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url: urlInput.value, timer: timerInput.checked }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Não foi possível encurtar o link.');
      short.value = data.shortUrl;
      resultInfo.textContent = data.timer
        ? 'Link criado com timer de 5 segundos:'
        : 'Link criado com redirecionamento direto:';
      copy.textContent = 'Copiar';
      result.hidden = false;
    } catch (err) {
      result.hidden = true;
      error.textContent = err.message;
    } finally {
      submit.disabled = false;
    }
  });

  copy.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(short.value);
    } catch {
      short.select();
      document.execCommand('copy');
    }
    copy.textContent = 'Copiado!';
  });
</script>
</body>
</html>
